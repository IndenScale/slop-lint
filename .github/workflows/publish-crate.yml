name: Publish crate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to crates.io"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Package dry run
        run: cargo package

      - name: Publish dry run
        run: cargo publish --dry-run

      - name: Publish
        if: env.CARGO_REGISTRY_TOKEN != '' && (startsWith(github.ref, 'refs/tags/') || inputs.publish == 'true')
        run: cargo publish

      - name: Explain skipped publish
        if: env.CARGO_REGISTRY_TOKEN == '' && (startsWith(github.ref, 'refs/tags/') || inputs.publish == 'true')
        run: |
          echo "CARGO_REGISTRY_TOKEN is not configured; crates.io publish was skipped."
          echo "Add the repository secret and rerun this workflow to publish."
