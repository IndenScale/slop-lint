[package]
name = "slop-lint"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Agent-facing linter for AI slop patterns in Markdown and text artifacts."
license = "MIT"
repository = "https://github.com/IndenScale/slop-lint"
homepage = "https://github.com/IndenScale/slop-lint"
documentation = "https://github.com/IndenScale/slop-lint#readme"
readme = "README.md"
keywords = ["ai", "lint", "markdown", "cli", "agents"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**",
    "rulesets/**",
    "README.md",
    "README_ZH.md",
    "CHANGELOG.md",
    "RELEASE.md",
    "LICENSE",
    "Cargo.toml",
    "Cargo.lock",
    "install.sh",
    "install.ps1",
]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.8"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.23.0"
